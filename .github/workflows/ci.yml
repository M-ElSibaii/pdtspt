name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          # Throwaway credentials for the CI container only; not a secret.
          MYSQL_ROOT_PASSWORD: ci-root
          MYSQL_DATABASE: pdtspt_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pci-root"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      APP_ENV: testing
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: pdtspt_test
      DB_USERNAME: root
      DB_PASSWORD: ci-root
      MAIL_MAILER: array
      QUEUE_CONNECTION: sync

    steps:
      - uses: actions/checkout@v4

      # composer.lock resolves to PHP 8.1-8.3 (symfony/* >=8.1, inertia-laravel <=8.3); 8.1 matches production.
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: mbstring, pdo_mysql, gd, zip, xml, intl, bcmath
          coverage: none

      - name: Composer install
        run: composer install --no-interaction --prefer-dist --no-progress

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Build front-end assets
        run: |
          npm ci
          npm run build

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Migrate the test database
        run: php artisan migrate --force

      - name: Test suite
        run: php artisan test
